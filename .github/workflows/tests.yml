name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile
        run: >
          .\.venv\Scripts\python.exe -m compileall -q
          app launcher.py launcher_web.py launcher_remote.py tests
      - name: Lint
        run: >
          .\.venv\Scripts\python.exe -m ruff check
          app tests launcher.py launcher_web.py launcher_remote.py scripts
      - name: Type check
        run: .\.venv\Scripts\python.exe -m mypy app
        continue-on-error: true
      - name: Run tests with coverage
        run: >
          .\.venv\Scripts\python.exe -m pytest tests -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=50
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Dependency audit
        run: .\.venv\Scripts\python.exe -m pip_audit
        continue-on-error: true
      - name: Diagnostics
        run: .\.venv\Scripts\python.exe -m app.doctor
        continue-on-error: true

  build:
    # Сборка медленная и тяжёлая: только вручную или на тег.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Fetch runtime assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models, tools | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile models\hand_landmarker.task `
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          Invoke-WebRequest -UseBasicParsing -OutFile tools\cloudflared.exe `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
      - name: Build
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\gen_version.py
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean jarvis.spec
      - name: Check dist size budget
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist\JARVIS -Recurse -File |
            Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("dist size: {0:N1} MB" -f $size)
          if ($size -gt 480) {
            throw ("dist too large: {0:N1} MB > 480 MB" -f $size)
          }
